<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Helvetica,Arial,sans-serif">
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">Figure 3. Evidence Ladder: Increasing External Validity</text>

  <!-- Rung 1: R1-A -->
  <rect x="60" y="70" width="880" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="80" y="98" font-size="15" font-weight="700" fill="#1e40af">R1-A: Controlled Identifiability</text>
  <text x="80" y="118" font-size="12" fill="#4a5568">Same paper, same code, two traces (clean vs. one controlled deviation). 30 pairs, 6 families &#215; 5.</text>
  <text x="80" y="134" font-size="12" font-weight="600" fill="#1e40af">Role: capability (mechanistic)</text>
  <text x="740" y="94" font-size="14" font-weight="700" fill="#1e40af">PSD = 27/30 = 0.900</text>
  <text x="740" y="112" font-size="11" fill="#4a5568">95% CI [0.735, 0.994]</text>
  <text x="740" y="130" font-size="11" fill="#4a5568">baselines B0&#8211;B3: 0/30</text>

  <!-- Rung 2: R1-B1 -->
  <rect x="120" y="160" width="760" height="70" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="140" y="188" font-size="15" font-weight="700" fill="#0369a1">R1-B1: Real Public Traces + Constructed Deviations</text>
  <text x="140" y="208" font-size="12" fill="#4a5568">2 public repositories (ViewBatchModel CVPR&#39;25, RevisitDML ICML&#39;20); 48 claim-level pairs.</text>
  <text x="140" y="224" font-size="12" font-weight="600" fill="#0369a1">Role: external-validity bridge</text>
  <text x="740" y="184" font-size="14" font-weight="700" fill="#0369a1">PSD = 48/48 = 1.000</text>
  <text x="740" y="202" font-size="11" fill="#4a5568">strict-VPS subset: 36/36</text>
  <text x="740" y="220" font-size="11" fill="#4a5568">95% CI [0.926, 1.000]</text>

  <!-- Rung 3: R1-C -->
  <rect x="180" y="250" width="640" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="278" font-size="15" font-weight="700" fill="#15803d">R1-C: Natural Historical Corrections</text>
  <text x="200" y="298" font-size="12" fill="#4a5568">8 real, independently-confirmed past violations (author errata, fix PR, reproducibility paper).</text>
  <text x="200" y="314" font-size="12" font-weight="600" fill="#15803d">Role: external validity (inferential)</text>
  <text x="740" y="274" font-size="14" font-weight="700" fill="#15803d">NVR = 8/8 = 1.0</text>
  <text x="740" y="292" font-size="11" fill="#4a5568">95% CI [0.631, 1.000]</text>
  <text x="740" y="310" font-size="11" fill="#4a5568">NPCR = 8/8, witness = 8/8</text>

  <!-- Rung 4: R1-D2 -->
  <rect x="240" y="340" width="520" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="260" y="368" font-size="15" font-weight="700" fill="#92400e">R1-D2: Search-Negative Control</text>
  <text x="260" y="388" font-size="12" fill="#4a5568">476 keyword-matched leads fully adjudicated; 0 additional confirmed cases.</text>
  <text x="260" y="404" font-size="12" font-weight="600" fill="#92400e">Role: specificity (negative control)</text>
  <text x="680" y="378" font-size="14" font-weight="700" fill="#92400e">0/476 confirmed</text>
  <text x="680" y="396" font-size="11" fill="#4a5568">95% upper bound 0.77%</text>

  <!-- Ladder arrows -->
  <line x1="100" y1="145" x2="130" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="235" x2="190" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="325" x2="250" y2="335" stroke="#94a3b8" stroke-width="2"/>

  <!-- Right-side gradient label -->
  <text x="960" y="240" font-size="11" fill="#718096" transform="rotate(-90 960 240)" text-anchor="middle">external validity &#8593;</text>

  <!-- Bottom note -->
  <text x="500" y="456" text-anchor="middle" font-size="12" fill="#4a5568">Each rung builds on the previous: capability &#8594; bridge &#8594; natural external validity &#8594; specificity.</text>
</svg>
